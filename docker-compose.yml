services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: donationhub-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - donationhub_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  donationhub_sql_data: